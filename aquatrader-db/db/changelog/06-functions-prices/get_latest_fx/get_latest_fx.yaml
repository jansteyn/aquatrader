databaseChangeLog:
  - changeSet:
      id: create-get_latest_fx-function
      author: jan
      runOnChange: true
      changes:
        - sql:
            sql: |
                CREATE OR REPLACE FUNCTION prices.get_latest_fx(
                    _base_currency  varchar(3),
                    _quote_currency varchar(3)
                )
                RETURNS TABLE
                (
                    price_date     date,
                    base_currency  varchar(3),
                    quote_currency varchar(3),
                    rate           numeric(20,10)
                )
                LANGUAGE sql
                STABLE
                AS $$
                    SELECT
                        f.price_date,
                        base.code,
                        quote.code,
                        f.rate

                    FROM prices.fx_rate_eod f

                    JOIN market.currency base
                        ON base.id = f.base_currency_id

                    JOIN market.currency quote
                        ON quote.id = f.quote_currency_id

                    WHERE base.code = upper(_base_currency)
                      AND quote.code = upper(_quote_currency)

                    ORDER BY f.price_date DESC

                    LIMIT 1;
                $$;
                comment on function prices.get_latest_fx is '
                HTTP GET /api/prices/fx/latest/{baseCurrency}/{quoteCurrency}
                @authenticated';
            splitStatements: false
