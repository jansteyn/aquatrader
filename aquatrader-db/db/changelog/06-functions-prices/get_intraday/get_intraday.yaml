databaseChangeLog:
  - changeSet:
      id: create-get-intraday-function
      author: jan
      runOnChange: true
      changes:
        - sql:
            sql: |
                CREATE OR REPLACE FUNCTION prices.get_intraday(
                    _listing_id       bigint,
                    _from_time        timestamptz,
                    _to_time          timestamptz
                )
                RETURNS TABLE
                (
                    price_time       timestamptz,

                    open             numeric(20,8),
                    high             numeric(20,8),
                    low              numeric(20,8),
                    close            numeric(20,8),

                    volume           numeric(30,0),
                    trade_count      bigint
                )
                LANGUAGE sql
                STABLE
                AS $$
                    SELECT
                        p.price_time,

                        p.open,
                        p.high,
                        p.low,
                        p.close,

                        p.volume,
                        p.trade_count

                    FROM prices.price_intraday p

                    WHERE p.listing_id = _listing_id
                    AND p.price_time >= _from_time
                    AND p.price_time <= _to_time

                    ORDER BY
                        p.price_time;
                $$;
                comment on function prices.get_intraday is '
                HTTP GET /api/prices/intraday/{listingId}/{fromTime}/{toTime}
                @anonymous';
            splitStatements: false
