databaseChangeLog:
  - changeSet:
      id: create-get-listing-eod-function
      author: jan
      runOnChange: true
      changes:
        - sql:
            sql: |
                CREATE OR REPLACE FUNCTION prices.get_listing_eod(
                    _listing_id bigint,
                    _from_date  date,
                    _to_date    date
                )
                RETURNS TABLE
                (
                    listing_id       bigint,
                    symbol           varchar(50),
                    instrument_name  varchar(300),
                    exchange_name    varchar(200),
                    currency_code    varchar(3),

                    price_date       date,

                    open             numeric(20,8),
                    high             numeric(20,8),
                    low              numeric(20,8),
                    close            numeric(20,8),
                    adjusted_close   numeric(20,8),

                    volume           numeric(30,0)
                )
                LANGUAGE sql
                STABLE
                AS $$
                    SELECT
                        l.id,
                        l.symbol,
                        i.name,
                        e.name,
                        c.code,

                        p.price_date,

                        p.open,
                        p.high,
                        p.low,
                        p.close,
                        p.adjusted_close,

                        p.volume

                    FROM prices.price_eod p

                    JOIN market.listing l
                        ON l.id = p.listing_id

                    JOIN market.instrument i
                        ON i.id = l.instrument_id

                    JOIN market.exchange e
                        ON e.id = l.exchange_id

                    JOIN market.currency c
                        ON c.id = l.currency_id

                    WHERE p.listing_id = _listing_id
                    AND p.price_date >= _from_date
                    AND p.price_date <= _to_date

                    ORDER BY p.price_date;
                $$;
                comment on function prices.get_listing_eod is '
                HTTP GET /api/prices/detaileod/{listingId}/{fromDate}/{toDate}
                @anonymous';
            splitStatements: false

                