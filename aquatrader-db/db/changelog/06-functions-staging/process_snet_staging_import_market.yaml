databaseChangeLog:
  - changeSet:
      id: process-snet-staging-import-market
      author: jan
      runOnChange: true
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE PROCEDURE staging.process_snet_staging_import()
              LANGUAGE plpgsql
              AS $$
              DECLARE
                  v_row_count bigint;
                  v_date_count bigint;
                  v_import_date date;
              BEGIN
                  PERFORM pg_advisory_xact_lock(hashtext('staging.process_snet_staging_import'));

                  SELECT count(*), count(DISTINCT price_date), min(price_date)
                  INTO v_row_count, v_date_count, v_import_date
                  FROM staging.snet_raw_share_prices;

                  IF v_row_count = 0 THEN
                      RETURN;
                  END IF;

                  IF v_date_count <> 1 THEN
                      RAISE EXCEPTION 'Expected staging.snet_raw_share_prices to contain one price date; found % dates', v_date_count;
                  END IF;

                  IF EXISTS (
                      SELECT 1
                      FROM staging.snet_raw_share_prices
                      WHERE nullif(btrim(exchange), '') IS NULL
                         OR nullif(btrim(code), '') IS NULL
                         OR nullif(btrim(currency), '') IS NULL
                         OR length(btrim(currency)) <> 3
                  ) THEN
                      RAISE EXCEPTION 'Staging rows must have an exchange, symbol, and three-character currency code';
                  END IF;

                  DROP TABLE IF EXISTS pg_temp.snet_import_rows;
                  CREATE TEMP TABLE snet_import_rows ON COMMIT DROP AS
                  SELECT DISTINCT ON (lower(btrim(exchange)), btrim(code))
                      btrim(exchange) AS exchange_name,
                      btrim(code) AS symbol,
                      upper(nullif(btrim(isin), '')) AS isin,
                      coalesce(nullif(btrim(full_name), ''), btrim(code)) AS instrument_name,
                      upper(btrim(currency)) AS currency_code,
                      price_date,
                      open,
                      high,
                      low,
                      close,
                      volume,
                      deals,
                      value,
                      oi,
                      dy,
                      ey,
                      bid,
                      offer,
                      nullif(btrim(ami_sector), '') AS sector
                  FROM staging.snet_raw_share_prices
                  ORDER BY lower(btrim(exchange)), btrim(code), btrim(exchange);

                  INSERT INTO market.currency (code, name)
                  SELECT DISTINCT currency_code, currency_code
                  FROM snet_import_rows
                  ON CONFLICT (code) DO NOTHING;

                  INSERT INTO market.exchange (name, short_name, timezone)
                  SELECT DISTINCT exchange_name, exchange_name, 'UTC'
                  FROM snet_import_rows r
                  WHERE NOT EXISTS (
                      SELECT 1
                      FROM market.exchange e
                      WHERE lower(btrim(e.name)) = lower(r.exchange_name)
                         OR lower(btrim(coalesce(e.short_name, ''))) = lower(r.exchange_name)
                  );

                  WITH instrument_candidates AS (
                      SELECT DISTINCT ON (
                          CASE WHEN isin IS NULL THEN 'N:' || lower(instrument_name) ELSE 'I:' || isin END
                      )
                          isin,
                          instrument_name,
                          sector
                      FROM snet_import_rows
                      ORDER BY
                          CASE WHEN isin IS NULL THEN 'N:' || lower(instrument_name) ELSE 'I:' || isin END,
                          instrument_name
                  )
                  INSERT INTO market.instrument (isin, name, instrument_type, sector)
                  SELECT c.isin, c.instrument_name, 'equity', c.sector
                  FROM instrument_candidates c
                  WHERE NOT EXISTS (
                      SELECT 1
                      FROM market.instrument i
                      WHERE (c.isin IS NOT NULL AND i.isin = c.isin)
                         OR (c.isin IS NULL
                             AND i.isin IS NULL
                             AND i.instrument_type = 'equity'
                             AND lower(i.name) = lower(c.instrument_name))
                  )
                  ON CONFLICT (isin) DO NOTHING;

                  INSERT INTO market.listing (
                      instrument_id,
                      exchange_id,
                      currency_id,
                      symbol,
                      local_symbol,
                      name,
                      listing_type
                  )
                  SELECT
                      i.id,
                      e.id,
                      c.id,
                      r.symbol,
                      r.symbol,
                      r.instrument_name,
                      'equity'
                  FROM snet_import_rows r
                  JOIN LATERAL (
                      SELECT exchange_row.id
                      FROM market.exchange exchange_row
                      WHERE lower(btrim(exchange_row.name)) = lower(r.exchange_name)
                         OR lower(btrim(coalesce(exchange_row.short_name, ''))) = lower(r.exchange_name)
                      ORDER BY
                          (lower(btrim(exchange_row.name)) = lower(r.exchange_name)) DESC,
                          exchange_row.id
                      LIMIT 1
                  ) e ON true
                  JOIN LATERAL (
                      SELECT instrument_row.id
                      FROM market.instrument instrument_row
                      WHERE (r.isin IS NOT NULL AND instrument_row.isin = r.isin)
                         OR (r.isin IS NULL
                             AND instrument_row.isin IS NULL
                             AND instrument_row.instrument_type = 'equity'
                             AND lower(instrument_row.name) = lower(r.instrument_name))
                      ORDER BY instrument_row.id
                      LIMIT 1
                  ) i ON true
                  JOIN market.currency c ON c.code = r.currency_code
                  ON CONFLICT (exchange_id, symbol) DO UPDATE
                  SET instrument_id = EXCLUDED.instrument_id,
                      currency_id = EXCLUDED.currency_id,
                      local_symbol = EXCLUDED.local_symbol,
                      name = EXCLUDED.name,
                      listing_type = EXCLUDED.listing_type;

                  INSERT INTO prices.price_eod (
                      listing_id,
                      price_date,
                      open,
                      high,
                      low,
                      close,
                      volume,
                      trade_count,
                      trade_value,
                      oi,
                      dy,
                      ey,
                      bid,
                      offer
                  )
                  SELECT
                      l.id,
                      r.price_date,
                      r.open,
                      r.high,
                      r.low,
                      r.close,
                      r.volume,
                      r.deals,
                      r.value,
                      r.oi,
                      r.dy,
                      r.ey,
                      r.bid,
                      r.offer
                  FROM snet_import_rows r
                  JOIN LATERAL (
                      SELECT exchange_row.id
                      FROM market.exchange exchange_row
                      WHERE lower(btrim(exchange_row.name)) = lower(r.exchange_name)
                         OR lower(btrim(coalesce(exchange_row.short_name, ''))) = lower(r.exchange_name)
                      ORDER BY
                          (lower(btrim(exchange_row.name)) = lower(r.exchange_name)) DESC,
                          exchange_row.id
                      LIMIT 1
                  ) e ON true
                  JOIN market.listing l
                    ON l.exchange_id = e.id
                   AND l.symbol = r.symbol
                  WHERE r.price_date = v_import_date
                  ON CONFLICT (listing_id, price_date) DO UPDATE
                  SET open = EXCLUDED.open,
                      high = EXCLUDED.high,
                      low = EXCLUDED.low,
                      close = EXCLUDED.close,
                      volume = EXCLUDED.volume,
                      trade_count = EXCLUDED.trade_count,
                      trade_value = EXCLUDED.trade_value,
                      oi = EXCLUDED.oi,
                      dy = EXCLUDED.dy,
                      ey = EXCLUDED.ey,
                      bid = EXCLUDED.bid,
                      offer = EXCLUDED.offer;

                  DROP TABLE snet_import_rows;
              END;
              $$;
            splitStatements: false
