databaseChangeLog:
  - changeSet:
      id: 01-indicator-tables
      author: jan
      changes:
        - sql:
            sql: |
              create table technical.indicator
              (
                  indicator_id       smallint generated always as identity,
                  code               varchar(50) not null,
                  name               varchar(100) not null,
                  description        text,
                  provider_name      varchar(50) not null,
                  output_count       smallint not null default 1,
                  is_active          boolean not null default true,
                  created_at         timestamptz not null default now(),
                  updated_at         timestamptz not null default now(),

                  constraint pk_indicator
                      primary key (indicator_id),

                  constraint uq_indicator_code
                      unique (code),

                  constraint ck_indicator_output_count
                      check (output_count > 0)
              );
            splitStatements: false
