databaseChangeLog:
  - changeSet:
      id: 02-price_intraday-tables
      author: jan
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS prices.price_intraday
              (
                  listing_id          bigint NOT NULL,
                  price_time          timestamptz NOT NULL,

                  open                numeric(20,8) NOT NULL,
                  high                numeric(20,8) NOT NULL,
                  low                 numeric(20,8) NOT NULL,
                  close               numeric(20,8) NOT NULL,

                  volume              numeric(30,0),
                  trade_count         bigint,

                  PRIMARY KEY (
                      listing_id,
                      price_time
                  ),

                  CONSTRAINT fk_price_intraday_listing
                      FOREIGN KEY (listing_id)
                      REFERENCES market.listing(id),


                  CONSTRAINT ck_price_intraday_ohlc
                      CHECK (
                          high >= low
                          AND high >= open
                          AND high >= close
                          AND low <= open
                          AND low <= close
                      ),

                  CONSTRAINT ck_price_intraday_positive
                      CHECK (
                          open > 0
                          AND high > 0
                          AND low > 0
                          AND close > 0
                      ),

                  CONSTRAINT ck_price_intraday_volume
                      CHECK (
                          volume IS NULL OR volume >= 0
                      )
              )
                PARTITION BY RANGE (price_time);
            splitStatements: false
