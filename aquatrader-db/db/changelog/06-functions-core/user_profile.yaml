databaseChangeLog:
  - changeSet:
      id: create-user-profile-function
      author: jan
      runOnChange: true
      changes:
        - sql:
            sql: |
                DROP FUNCTION IF EXISTS core.user_profile;
                
                CREATE OR REPLACE FUNCTION core.user_profile()
                RETURNS TABLE (
                    user_id bigint,
                    username varchar(100),
                    full_name varchar(255),
                    roles text[],
                    email varchar(255)
                )
                LANGUAGE plpgsql
                AS $$
                BEGIN
                    RETURN QUERY
                    SELECT 
                        u.id,
                        u.username,
                        u.full_name,
                        u.roles,
                        u.email
                    FROM 
                        core.users u
                    WHERE u.id = current_setting('request.user_id')::bigint;
                END;
                $$;
                comment on function core.user_profile is '
                HTTP GET
                @sensitive
                @authenticated';
            splitStatements: false
