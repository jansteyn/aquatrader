databaseChangeLog:
  - changeSet:
      id: create-password_verification_succeeded-procedure
      author: jan
      runOnChange: true
      changes:
        - sql:
            sql: |
              DROP PROCEDURE IF EXISTS core.password_verification_succeeded;

              CREATE OR REPLACE PROCEDURE core.password_verification_succeeded
                (
                    _scheme text,
                    _user_id text,
                    _user_name text
                )
                language plpgsql
                set search_path = pg_catalog, pg_temp
                as
                $$
                begin
                    -- Update last login timestamp
                    update core.users
                    set
                        last_login = now(),
                        last_login_provider = _scheme
                    where id = _user_id::bigint;

                    raise notice 'Password verification succeeded for user % (ID: %) using scheme %',
                        _user_name, _user_id, _scheme;
                end;
                $$;
            splitStatements: false
