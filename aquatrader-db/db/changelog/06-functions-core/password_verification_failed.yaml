databaseChangeLog:
  - changeSet:
      id: create-password_verification_failed-procedure
      author: jan
      runOnChange: true
      changes:
        - sql:
            sql: |
                DROP PROCEDURE IF EXISTS core.password_verification_failed;
                CREATE OR REPLACE PROCEDURE core.password_verification_failed
                (
                    _scheme text,
                    _user_id text,
                    _user_name text
                )
                language plpgsql
                set search_path = pg_catalog, pg_temp
                as
                $$
                begin
                    update core.users
                    set
                        access_failed_count = access_failed_count + 1,
                        last_login_provider = _scheme
                    where id = _user_id::bigint;
                    -- Log failed attempt, increment counters, implement lockout, etc.
                    raise warning 'Password verification failed for user % (ID: %) using scheme %',
                        _user_name, _user_id, _scheme;
                end;
                $$;
            splitStatements: false
